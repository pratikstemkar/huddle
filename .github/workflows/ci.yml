name: CI

# Only run when code or build config changes. README, docs and other
# markdown-only edits skip CI. (workflow_dispatch can still run it by hand.)
on:
  push:
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'test-utils/**'
      - 'supabase/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'metro.config.js'
      - 'eslint.config.js'
      - 'jest.setup.ts'
      - 'expo-env.d.ts'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'test-utils/**'
      - 'supabase/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'metro.config.js'
      - 'eslint.config.js'
      - 'jest.setup.ts'
      - 'expo-env.d.ts'
      - '.github/workflows/**'
  merge_group:
  workflow_dispatch:

# A newer run on the same branch or PR replaces the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck & Expo doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx expo-doctor

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test --ci --coverage --coverageReporters=text-summary
